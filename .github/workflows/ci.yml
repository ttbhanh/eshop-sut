name: API Tests CI

on:
  push:
    branches: [ "main", "master", "feature/**", "hw06" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Install Newman & HTML Extra Reporter
      run: npm install --global newman newman-reporter-htmlextra

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Create Reports Directory
      run: mkdir -p tests/reports

    - name: Start backend server
      working-directory: ./backend
      run: node server.js > ../tests/reports/server.log 2>&1 &

    - name: Wait for server to be ready
      run: |
        for attempt in {1..30}; do
          if curl --fail --silent http://localhost:3000/api/products > /dev/null; then
            echo "Backend is ready after ${attempt} attempt(s)."
            exit 0
          fi
          sleep 1
        done
        echo "Backend did not become ready in 30 seconds."
        cat tests/reports/server.log
        exit 1

    - name: Run Newman All-Pass Suite
      run: >-
        newman run tests/EShop_API_Test_Suite.postman_collection.json -e tests/EShop_Environment.postman_environment.json --folder "CI - All Pass" -r cli,htmlextra --reporter-htmlextra-export tests/reports/ci-all-pass.html

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: API-Test-Reports
        path: |
          tests/reports/*.html
          tests/reports/server.log
        if-no-files-found: warn

    - name: Publish CI summary
      if: always()
      run: |
        {
          echo "## Newman API test run"
          echo ""
          echo "- Commit: `${GITHUB_SHA}`"
          echo "- Workflow run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          echo "- HTML reports: download the `API-Test-Reports` artifact above."
        } >> "$GITHUB_STEP_SUMMARY"